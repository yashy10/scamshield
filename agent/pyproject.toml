[project]
name = "scamshield-agent"
version = "0.1.0"
description = "ScamShield investigator agent: Strands + Claude Opus 5.5 on Amazon Bedrock, calling the ScamShield MCP tools."
requires-python = ">=3.12,<3.14"
dependencies = [
    "strands-agents[anthropic]>=1.64,<2",
    "anthropic[bedrock]>=0.125",
    "bedrock-agentcore>=1.25",
    "boto3>=1.40",
    # AgentCore Runtime starts the code with `opentelemetry-instrument main.py` (traces to CloudWatch).
    "aws-opentelemetry-distro~=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # The MCP server package, for end-to-end tests with its in-memory fakes.
    "scamshield-mcp",
]

[tool.uv.sources]
scamshield-mcp = { path = "../mcp_server", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scamshield_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
