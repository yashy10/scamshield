<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ScamShield{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='3' fill='%232348a0'/%3E%3Cpath d='M3 9l13 9 13-9' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">

</head>
<body>
  <header class="masthead">
    <a class="brand" href="/">ScamShield</a>
  </header>
  <main class="page">
    {% block content %}{% endblock %}

</body>
</html>
